<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>事前設定ルーレット</title>
  <style>
    :root {
      --bg: #fff8f2;
      --panel: #fff;
      --text: #262626;
      --muted: #6b7280;
      --accent: #f43f5e;
      --accent-2: #fb923c;
      --soft: #fef3c7;
      --shadow: 0 18px 42px rgba(244, 63, 94, 0.14);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff7ed 0%, #fff1f2 100%);
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
    }

    .app {
      width: min(1000px, calc(100% - 30px));
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(251,146,60,0.15);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: clamp(1.8rem, 3vw, 2.8rem); }
    .link { text-decoration: none; color: var(--accent); font-weight: 700; }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 26px;
      align-items: center;
    }

    .wheel-wrap {
      position: relative;
      width: min(410px, 74vw);
      aspect-ratio: 1;
      margin: 0 auto;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 12px solid #fff;
      box-shadow: 0 20px 38px rgba(244, 63, 94, 0.2);
      transition: transform 5s cubic-bezier(0.12, 0.9, 0.22, 1);
    }

    .pointer {
      position: absolute;
      left: 50%;
      top: -12px;
      transform: translateX(-50%);
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 34px solid #111827;
      z-index: 2;
    }

    .panel {
      display: grid;
      gap: 18px;
    }

    textarea {
      border: 1px solid rgba(148,163,184,0.45);
      border-radius: 16px;
      padding: 14px 16px;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      font-size: 1rem;
      background: rgba(255,255,255,0.9);
    }

    .preset-box {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="number"] {
      border: 1px solid rgba(148,163,184,0.45);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 1rem;
      width: 120px;
      background: rgba(255,255,255,0.9);
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), #fb7185);
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(244, 63, 94, 0.16);
    }

    .button-secondary {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      box-shadow: 0 14px 26px rgba(249,115,22,0.16);
    }

    .chip {
      background: rgba(251,146,60,0.12);
      border: 1px solid rgba(251,146,60,0.2);
      color: #9a3d12;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-block;
    }

    .result {
      background: rgba(244, 63, 94, 0.08);
      border-radius: 16px;
      padding: 16px 18px;
      min-height: 58px;
      display: flex;
      align-items: center;
      font-weight: 800;
    }

    ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.8;
      max-height: 180px;
      overflow: auto;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .app { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <h1>事前設定ルーレット</h1>
      <a class="link" href="index.html">一覧へ戻る</a>
    </div>

    <div class="grid">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <div id="wheel" class="wheel">
          <canvas id="canvas" width="600" height="600"></canvas>
        </div>
      </div>

      <div class="panel">
        <div>
          <label for="items">候補項目</label>
          <textarea id="items">A, B, C, D, E, F, G</textarea>
        </div>

        <div class="preset-box">
          <div>
            <label for="preset">当たり設定</label>
            <input id="preset" type="number" min="-1" value="2" />
          </div>
          <button id="spin">回す</button>
          <button id="redraw" class="button-secondary">再描画</button>
        </div>

        <div class="chip">-1 にするとランダム。0 から始まるインデックスで当たりを固定できます。</div>

        <div>
          <label>候補一覧</label>
          <ul id="list"></ul>
        </div>

        <div class="result" id="result">設定済みの当たりは「2」です</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wheel = document.getElementById('wheel');
    const itemsEl = document.getElementById('items');
    const presetEl = document.getElementById('preset');
    const resultEl = document.getElementById('result');
    const listEl = document.getElementById('list');

    function parseItems(text) {
      return text.split(/[\n,]+/).map(v => v.trim()).filter(Boolean);
    }

    function drawWheel(items) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = Math.min(cx, cy) - 12;
      const step = (Math.PI * 2) / items.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(cx, cy);

      items.forEach((item, index) => {
        const start = index * step;
        const end = start + step;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = `hsl(${(index * 340) / items.length + 20} 76% 62%)`;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + step / 2);
        ctx.fillStyle = '#1f2937';
        ctx.font = '600 22px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(item, radius * 0.76, 8);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#fef2f2';
      ctx.fill();
      ctx.strokeStyle = '#fcd34d';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    function renderList(items) {
      listEl.innerHTML = '';
      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.textContent = `${index}. ${item}`;
        listEl.appendChild(li);
      });
    }

    function refresh() {
      const items = parseItems(itemsEl.value);
      if (!items.length) {
        listEl.innerHTML = '<li>なし</li>';
        resultEl.textContent = '項目を入力してください';
        return;
      }

      drawWheel(items);
      renderList(items);
      const preset = Number(presetEl.value);
      resultEl.textContent = Number.isInteger(preset) && preset >= 0
        ? `設定済みの当たりは「${preset}」です`
        : '設定なし: ランダムで決定します';
      wheel.style.transition = 'none';
      wheel.style.transform = 'rotate(0deg)';
    }

    document.getElementById('redraw').addEventListener('click', refresh);

    document.getElementById('spin').addEventListener('click', () => {
      const items = parseItems(itemsEl.value);
      if (!items.length) {
        resultEl.textContent = '項目を入力してください';
        return;
      }

      const preset = Number(presetEl.value);
      const winner = Number.isInteger(preset) && preset >= 0 && preset < items.length ? preset : Math.floor(Math.random() * items.length);
      const segment = 360 / items.length;
      const targetCenter = winner * segment + segment / 2;
      const finalRotation = 360 * 8 + (360 - targetCenter);

      wheel.style.transition = 'transform 5s cubic-bezier(0.12, 0.9, 0.22, 1)';
      wheel.style.transform = `rotate(${finalRotation}deg)`;

      setTimeout(() => {
        resultEl.textContent = `当たり: ${winner}. ${items[winner]}`;
      }, 4700);
    });

    refresh();
  </script>
</body>
</html>
